name: buer

services:
  buer:
    image: ${BUER_IMAGE:?}
    container_name: buer
    hostname: buer
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      ROBOMP_GH_PROXY_URL: http://buer-gh-proxy:8081
      ROBOMP_GH_PROXY_HMAC_KEY: ${ROBOMP_GH_PROXY_HMAC_KEY:?}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?}
      ROBOMP_BOT_LOGIN: ${ROBOMP_BOT_LOGIN:?}
      ROBOMP_GIT_AUTHOR_NAME: ${ROBOMP_GIT_AUTHOR_NAME:-}
      ROBOMP_GIT_AUTHOR_EMAIL: ${ROBOMP_GIT_AUTHOR_EMAIL:?}
      ROBOMP_REPO_ALLOWLIST: ${ROBOMP_REPO_ALLOWLIST:?}
      ROBOMP_MAINTAINER_LOGINS: ${ROBOMP_MAINTAINER_LOGINS:-}
      ROBOMP_REVIEWER_BOTS: ${ROBOMP_REVIEWER_BOTS:-}
      ROBOMP_PR_REVIEW_ENABLED: ${ROBOMP_PR_REVIEW_ENABLED:-true}
      ROBOMP_RELEASE_SENTINEL_ENABLED: ${ROBOMP_RELEASE_SENTINEL_ENABLED:-false}
      ROBOMP_MODEL: ${ROBOMP_MODEL:-}
      ROBOMP_THINKING: ${ROBOMP_THINKING:-high}
      ROBOMP_MAX_CONCURRENCY: ${ROBOMP_MAX_CONCURRENCY:-4}
      ROBOMP_TASK_TIMEOUT_SECONDS: ${ROBOMP_TASK_TIMEOUT_SECONDS:-2400}
      ROBOMP_TASK_TIMEOUT_HARD_GRACE_SECONDS: ${ROBOMP_TASK_TIMEOUT_HARD_GRACE_SECONDS:-60}
      ROBOMP_REQUEST_TIMEOUT_SECONDS: ${ROBOMP_REQUEST_TIMEOUT_SECONDS:-120}
      ROBOMP_RATE_LIMIT_WINDOW_SECONDS: ${ROBOMP_RATE_LIMIT_WINDOW_SECONDS:-3600}
      ROBOMP_RATE_LIMIT_DEFAULT: ${ROBOMP_RATE_LIMIT_DEFAULT:-3}
      ROBOMP_RATE_LIMIT_CONTRIBUTOR: ${ROBOMP_RATE_LIMIT_CONTRIBUTOR:-10}
      ROBOMP_RATE_LIMIT_UNLIMITED: ${ROBOMP_RATE_LIMIT_UNLIMITED:-}
      ROBOMP_QUESTION_AUTOCLOSE_ENABLED: ${ROBOMP_QUESTION_AUTOCLOSE_ENABLED:-true}
      ROBOMP_QUESTION_AUTOCLOSE_HOURS: ${ROBOMP_QUESTION_AUTOCLOSE_HOURS:-4}
      ROBOMP_QUESTION_AUTOCLOSE_SCAN_SECONDS: ${ROBOMP_QUESTION_AUTOCLOSE_SCAN_SECONDS:-60}
      ROBOMP_ISSUE_INDEX_SYNC_SECONDS: ${ROBOMP_ISSUE_INDEX_SYNC_SECONDS:-900}
      ROBOMP_RECLAIM_WORKSPACE_CACHES: ${ROBOMP_RECLAIM_WORKSPACE_CACHES:-true}
      ROBOMP_OMP_COMMAND: omp
      ROBOMP_WORKSPACE_ROOT: /data/workspaces
      ROBOMP_SQLITE_PATH: /data/robomp.sqlite
      ROBOMP_LOG_DIR: /data/logs
      ROBOMP_BIND_HOST: 0.0.0.0
      ROBOMP_BIND_PORT: "8080"
      PI_ROOT: /work/pi
      ROBOMP_LITELLM_KEY: ${ROBOMP_LITELLM_KEY:?}
    volumes:
      - ${BUER_SRC:?}:/work/pi:ro
      - ${BUER_DATA:?}:/data
      - ${BUER_MODELS:?}:/srv/agent-home-stage/.omp/agent/models.yml:ro
      - ${BUER_AGENTS_MD:?}:/srv/agent-home-stage/.agent/AGENTS.md:ro
    ports:
      - "127.0.0.1:${BUER_BIND_PORT:-6543}:8080"
    networks:
      - default
      - buer_internal
      - litellm

  buer-gh-proxy:
    image: ${BUER_IMAGE:?}
    container_name: buer-gh-proxy
    hostname: buer-gh-proxy
    restart: unless-stopped
    command: ["python", "-m", "robomp.proxy", "serve"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?}
      ROBOMP_GH_PROXY_HMAC_KEY: ${ROBOMP_GH_PROXY_HMAC_KEY:?}
      ROBOMP_WORKSPACE_ROOT: /data/workspaces
      ROBOMP_SQLITE_PATH: /data/robomp.sqlite
      ROBOMP_LOG_DIR: /data/logs
      ROBOMP_GH_PROXY_BIND_HOST: 0.0.0.0
      ROBOMP_GH_PROXY_BIND_PORT: "8081"
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?}
      ROBOMP_BOT_LOGIN: ${ROBOMP_BOT_LOGIN:?}
      ROBOMP_GIT_AUTHOR_EMAIL: ${ROBOMP_GIT_AUTHOR_EMAIL:?}
      ROBOMP_REPO_ALLOWLIST: ${ROBOMP_REPO_ALLOWLIST:?}
    volumes:
      - ${BUER_DATA:?}:/data
    networks:
      - default
      - buer_internal

networks:
  default: {}
  buer_internal:
    internal: true
  litellm:
    external: true
