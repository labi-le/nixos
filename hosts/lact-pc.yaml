# Deployed to /etc/lact/config.yaml via environment.etc, so this file is the
# source of truth for the GPU profile: -60mV undervolt, 1375MHz VRAM, 364W cap,
# COMPUTE power profile (needs performance_level: manual), custom fan curve.
# Because /etc/lact/config.yaml ends up a store symlink, the LACT GUI can no
# longer save changes -- edit here and rebuild instead.
# services.lact.settings is deliberately not used: pkgs.formats.yaml quotes map
# keys ('40': 0.3) and LACT parses the fan curve as BTreeMap<i32, f32>.
version: 6
daemon:
  log_level: info
  admin_group: wheel
  disable_clocks_cleanup: false
apply_settings_timer: 5
gpus:
  1002:7550-1458:2426-0000:03:00.0:
    fan_control_enabled: true
    fan_control_settings:
      mode: curve
      static_speed: 1.0
      temperature_key: edge
      interval_ms: 500
      curve:
        40: 0.3
        50: 0.35
        60: 0.68
        70: 0.8
        80: 1.0
      spindown_delay_ms: 5000
      change_threshold: 2
    pmfw_options:
      zero_rpm: false
    power_cap: 364.0
    performance_level: manual
    power_profile_mode_index: 5
    max_memory_clock: 1375
    gpu_clock_offsets:
      0: 0
    voltage_offset: -60
current_profile: null
auto_switch_profiles: false