<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Станция</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0c;
    --card: #141418;
    --line: #232329;
    --fg: #f2f2f5;
    --dim: #9a9aa6;
    --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #views { padding: 14px 14px 132px; max-width: 1100px; margin: 0 auto; }
  .top { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  input[type=search] {
    flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font-size: 15px; outline: none;
  }
  input[type=search]:focus { border-color: #3a3a44; }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }
  .album { background: none; border: 0; padding: 0; color: inherit; text-align: left; cursor: pointer; }
  .cover {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px;
    background: linear-gradient(140deg, #1d1d26, #121216);
    display: block;
  }
  .cover.ph {
    display: flex; align-items: center; justify-content: center;
    color: #4c4c5a; font-size: 34px; font-weight: 700;
  }
  .album .t { margin-top: 7px; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .album .a { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head { display: flex; gap: 14px; align-items: flex-end; margin-bottom: 16px; }
  .head .cover { width: 120px; flex: 0 0 120px; border-radius: 14px; }
  .head h1 { font-size: 21px; margin: 0 0 4px; line-height: 1.2; }
  .head .sub { color: var(--dim); font-size: 13px; }
  .back {
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 13px; font-size: 14px; cursor: pointer;
  }
  ol { list-style: none; margin: 0; padding: 0; }
  ol li { border-bottom: 1px solid var(--line); }
  ol button {
    width: 100%; display: flex; gap: 12px; align-items: baseline; text-align: left;
    background: none; border: 0; color: inherit; padding: 12px 4px; font-size: 15px; cursor: pointer;
  }
  ol button .n { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 26px; font-size: 13px; }
  ol button.on .t { color: var(--accent); font-weight: 600; }
  #np {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(14, 14, 17, .93); backdrop-filter: blur(18px);
    border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  #np .inner { max-width: 1100px; margin: 0 auto; }
  #np .row { display: flex; gap: 12px; align-items: center; }
  #npArt .cover { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 10px; font-size: 22px; }
  #np .meta { flex: 1; min-width: 0; }
  #np .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np .a { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np .line { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  #bar { flex: 1; height: 3px; background: #26262d; border-radius: 2px; overflow: hidden; }
  #bar div { height: 100%; width: 0; background: var(--accent); transition: width .5s linear; }
  #npTime { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; font-weight: 600; min-width: 84px; text-align: right; }
  .keys { display: flex; gap: 6px; }
  .keys button {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font-size: 16px; line-height: 1; cursor: pointer;
  }
  .keys button:active { background: #202028; }
  .keys #play { background: var(--accent); border-color: var(--accent); }
  .empty { color: var(--dim); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div id="views">
  <section id="albumsView">
    <div class="top"><input id="q" type="search" placeholder="Поиск по трекам и альбомам"></div>
    <div id="albums" class="grid"></div>
  </section>
  <section id="albumView" hidden>
    <div class="top"><button class="back" id="back">← Все альбомы</button></div>
    <div class="head" id="albumHead"></div>
    <ol id="tracks"></ol>
  </section>
</div>

<div id="np">
  <div class="inner">
    <div class="row">
      <div id="npArt"></div>
      <div class="meta">
        <div class="t" id="npTitle">—</div>
        <div class="a" id="npArtist"></div>
      </div>
      <div class="keys">
        <button id="prev" title="Назад">⏮</button>
        <button id="play" title="Пауза">⏵</button>
        <button id="next" title="Дальше">⏭</button>
        <button id="stop" title="Стоп">⏹</button>
      </div>
    </div>
    <div class="line">
      <div id="bar"><div id="fill"></div></div>
      <div id="npTime"></div>
    </div>
  </div>
</div>

<script>
const api = q => fetch('cgi-bin/ctl?' + q, { cache: 'no-store' }).then(r => r.text());
const COVERS = 'http://192.168.1.2/covers/';
const state = { albums: new Map(), cover: new Map(), tracks: [], cur: -1, raw: [] };

const el = id => document.getElementById(id);
const coverUrl = (artist, album) => {
  const h = state.cover.get(artist + '\u0000' + album);
  return h ? COVERS + h + '.jpg' : null;
};
const mmss = ms => {
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
const letter = (artist, album) => ((album || artist || '♪').trim()[0] || '♪').toUpperCase();

function art(artist, album, cls, lazy) {
  const url = coverUrl(artist, album);
  if (url) {
    const img = document.createElement('img');
    img.className = cls;
    img.alt = '';
    if (lazy) img.loading = 'lazy';
    img.src = url;
    return img;
  }
  const d = document.createElement('div');
  d.className = cls + ' ph';
  d.textContent = letter(artist, album);
  return d;
}

function buildAlbums() {
  state.albums = new Map();
  state.tracks = [];
  for (const line of state.raw) {
    const [idx, artist, album, ...rest] = line.split('\t');
    const rec = { idx: +idx, artist, album, title: rest.join('\t') };
    state.tracks.push(rec);
    const key = artist + '\u0000' + album;
    if (!state.albums.has(key)) state.albums.set(key, { artist, album, tracks: [] });
    state.albums.get(key).tracks.push(rec);
  }
}

function renderAlbums(filter) {
  const box = el('albums');
  box.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  const items = [...state.albums.values()].filter(a =>
    !f || a.album.toLowerCase().includes(f) || a.artist.toLowerCase().includes(f) ||
    a.tracks.some(t => t.title.toLowerCase().includes(f)));
  if (!items.length) {
    box.innerHTML = '<div class="empty">Ничего не нашлось</div>';
    return;
  }
  for (const a of items) {
    const b = document.createElement('button');
    b.className = 'album';
    const t = document.createElement('div');
    t.className = 't';
    t.textContent = a.album || 'Без альбома';
    const s = document.createElement('div');
    s.className = 'a';
    s.textContent = a.artist;
    b.append(art(a.artist, a.album, 'cover', true), t, s);
    b.onclick = () => openAlbum(a);
    box.append(b);
  }
}

function openAlbum(a) {
  el('albumsView').hidden = true;
  el('albumView').hidden = false;
  const head = el('albumHead');
  head.innerHTML = '';
  const info = document.createElement('div');
  const h = document.createElement('h1');
  h.textContent = a.album || 'Без альбома';
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = a.artist + ' · ' + a.tracks.length + ' трек(ов)';
  info.append(h, sub);
  head.append(art(a.artist, a.album, 'cover', false), info);

  const ol = el('tracks');
  ol.innerHTML = '';
  a.tracks.forEach((t, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.dataset.idx = t.idx;
    b.innerHTML = '<span class="n"></span><span class="t"></span>';
    b.querySelector('.n').textContent = i + 1;
    b.querySelector('.t').textContent = t.title;
    b.onclick = () => api('cmd=play&idx=' + t.idx);
    li.append(b);
    ol.append(li);
  });
  markCurrent(state.cur);
}

function markCurrent(idx) {
  document.querySelectorAll('#tracks button').forEach(b =>
    b.classList.toggle('on', +b.dataset.idx === idx));
}

let lastArt = '';
async function poll() {
  const line = (await api('cmd=now')).trim();
  const [mode, idx, count, pos, dur, artist, album, ...rest] = line.split('\t');
  const title = rest.join('\t');
  state.cur = +idx;
  el('npTitle').textContent = title || '—';
  el('npArtist').textContent = [artist, album].filter(Boolean).join(' · ') ||
    (mode === 'stop' ? 'остановлено' : '');
  el('play').textContent = mode === 'pause' ? '⏵' : mode === 'play' ? '⏸' : '⏵';
  el('npTime').textContent = dur > 0 ? mmss(pos) + ' / ' + mmss(dur) : '';
  el('fill').style.width = dur > 0 ? Math.min(100, pos / dur * 100) + '%' : '0%';
  const key = artist + '\u0000' + album;
  if (key !== lastArt) {
    lastArt = key;
    el('npArt').replaceChildren(art(artist, album, 'cover', false));
  }
  markCurrent(state.cur);
}

async function boot() {
  await api('cmd=refresh');
  const [list, covers] = await Promise.all([api('cmd=list'), api('cmd=covers')]);
  state.raw = list.trim().split('\n');
  for (const line of covers.trim().split('\n')) {
    const tab = line.indexOf('\t');
    if (tab > 0) state.cover.set(line.slice(0, tab).replace('/', '\u0000'), line.slice(tab + 1));
  }
  buildAlbums();
  renderAlbums('');
  el('q').oninput = e => renderAlbums(e.target.value);
  el('back').onclick = () => {
    el('albumView').hidden = true;
    el('albumsView').hidden = false;
  };
  el('play').onclick = () => api('cmd=toggle');
  el('next').onclick = () => api('cmd=next');
  el('prev').onclick = () => api('cmd=prev');
  el('stop').onclick = () => api('cmd=stop');
  poll();
  setInterval(poll, 1000);
}

boot();
</script>
</body>
</html>
